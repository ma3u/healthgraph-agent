name: HealthGraphSync
options:
  bundleIdPrefix: io.healthgraph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set this to your Apple developer team ID before signing
    CODE_SIGN_STYLE: Automatic

targets:
  HealthGraphSync:
    type: application
    platform: iOS
    sources:
      - path: HealthGraphSync/Sources/HealthGraphSync
    resources:
      - path: HealthGraphSync/Resources
        optional: true
    info:
      path: HealthGraphSync/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthGraph Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [healthkit]
        # HealthKit usage strings — required by Apple, displayed in the permission prompt.
        NSHealthShareUsageDescription: "HealthGraph Sync reads your HealthKit data so it can upload it to your private Aura graph for personal analysis."
        NSHealthUpdateUsageDescription: "HealthGraph Sync does not write data back to HealthKit, but iOS requires this string."
        # Custom config the app reads via AppConfig.swift.
        # Fill these in after running through docs/AUTH_SETUP.md.
        AUTH0_DOMAIN: ""              # e.g. "healthgraph.us.auth0.com"
        AUTH0_CLIENT_ID: ""           # from Auth0 Application → Settings
        AUTH0_AUDIENCE: ""            # e.g. "https://healthgraph.io/aura"
        NEODASH_URL: ""
        # URL scheme so Auth0 can redirect back to the app after sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: io.healthgraph.sync.callback
            CFBundleURLSchemes:
              - io.healthgraph.sync
    entitlements:
      path: HealthGraphSync/Resources/HealthGraphSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.healthgraph.sync
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
