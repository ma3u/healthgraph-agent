name: HealthGraphSync
options:
  bundleIdPrefix: io.healthgraph
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "38R8Z4P7S8" # Matthias Buchhorn personal team
    CODE_SIGN_STYLE: Automatic

targets:
  HealthGraphSync:
    type: application
    platform: iOS
    sources:
      - path: HealthGraphSync/Sources/HealthGraphSync
      - path: HealthGraphSync/Resources/Assets.xcassets
    info:
      path: HealthGraphSync/Resources/Info.plist
      properties:
        CFBundleDisplayName: HealthGraph Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [healthkit]
        # HealthKit usage strings — required by Apple, displayed in the permission prompt.
        NSHealthShareUsageDescription: "HealthGraph Sync reads your HealthKit data so it can upload it to your private Aura graph for personal analysis."
        NSHealthUpdateUsageDescription: "HealthGraph Sync does not write data back to HealthKit, but iOS requires this string."
        # Production path — fill these in after running through docs/AUTH_SETUP.md.
        AUTH0_DOMAIN: ""              # e.g. "healthgraph.us.auth0.com"
        AUTH0_CLIENT_ID: ""           # from Auth0 Application → Settings
        AUTH0_AUDIENCE: ""            # e.g. "https://healthgraph.io/aura"
        # Dev-mode path — patched in by scripts/build_ios.sh from .env.
        # Leave empty in version control; scripts injects real values.
        DEV_AURA_GRAPHQL_URL: ""
        DEV_AURA_API_KEY: ""
        NEODASH_URL: ""
        AURA_DASHBOARD_URL: ""
        # Aura Agent REST endpoint + OAuth client credentials.
        # Empty = "Ask your graph" panel is hidden in the Dashboard tab.
        # Filled in by scripts/build_ios.sh from .env (AURA_AGENT_*).
        AURA_AGENT_URL: ""
        AURA_AGENT_TOKEN_URL: ""
        AURA_AGENT_CLIENT_ID: ""
        AURA_AGENT_CLIENT_SECRET: ""
        # Aura instance management (resume) for the daily background sync.
        # Injected by scripts/build_ios.sh from .env (AURA_CLIENT_*/AURA_INSTANCEID).
        AURA_CLIENT_ID: ""
        AURA_CLIENT_SECRET: ""
        AURA_INSTANCEID: ""
        # Background daily-sync task (BGProcessingTask).
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - io.healthgraph.sync.dailysync
        # URL scheme so Auth0 can redirect back to the app after sign-in.
        CFBundleURLTypes:
          - CFBundleURLName: io.healthgraph.sync.callback
            CFBundleURLSchemes:
              - io.healthgraph.sync
    entitlements:
      path: HealthGraphSync/Resources/HealthGraphSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.healthgraph.sync
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  HealthGraphSyncTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: HealthGraphSync
    sources:
      - path: HealthGraphSync/Tests/HealthGraphSyncTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.healthgraph.sync.tests
        GENERATE_INFOPLIST_FILE: YES
