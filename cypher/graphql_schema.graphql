# GraphQL SDL for the Apple Health graph in Neo4j Aura
#
# Paste this into Aura Console → GraphQL Data APIs → "Create" → "Define my own"
# for the MyAppleHealthData instance. Or use "Fetch from instance" if you'd
# rather have Aura introspect — but this file is the canonical curated version
# that names relationships, scopes types, and excludes NeoDash internals.
#
# Generated 2026-05-14 from the live schema; see docs/AURA_VERIFICATION.md for
# how the property names were enumerated.

type Person @node {
  name: String!
  biologicalSex: String @alias(property: "biological_sex")

  uses: [Device!]! @relationship(type: "USES", direction: OUT)
  recorded: [Workout!]! @relationship(type: "RECORDED", direction: OUT)
}

type Device @node {
  name: String!

  usedBy: [Person!]! @relationship(type: "USES", direction: IN)
}

type Week @node {
  iso: String!
  year: Int
  weekNumber: Int @alias(property: "week_number")
  startDate: Date @alias(property: "start_date")

  days: [Day!]! @relationship(type: "PART_OF", direction: IN)
}

type Day @node {
  date: Date!
  dayOfWeek: String @alias(property: "day_of_week")

  # Apple Activity rings
  ringMove: Float @alias(property: "ring_move")
  ringMoveGoal: Float @alias(property: "ring_move_goal")
  ringExercise: Float @alias(property: "ring_exercise")
  ringExerciseGoal: Float @alias(property: "ring_exercise_goal")
  ringStand: Float @alias(property: "ring_stand")
  ringStandGoal: Float @alias(property: "ring_stand_goal")

  week: Week @relationship(type: "PART_OF", direction: OUT)
  summary: DailySummary @relationship(type: "HAS_SUMMARY", direction: OUT)
  workouts: [Workout!]! @relationship(type: "ON_DAY", direction: IN)
  sleep: SleepSession @relationship(type: "ON_DAY", direction: IN)
  nextDay: Day @relationship(type: "NEXT_DAY", direction: OUT)
  previousDay: Day @relationship(type: "NEXT_DAY", direction: IN)
}

type DailySummary @node {
  date: Date!

  # Heart
  avgHeartRate: Float @alias(property: "avg_heart_rate")
  minHeartRate: Float @alias(property: "min_heart_rate")
  maxHeartRate: Float @alias(property: "max_heart_rate")
  restingHeartRate: Float @alias(property: "resting_heart_rate")
  hrvMean: Float @alias(property: "hrv_mean")

  # Activity
  totalSteps: Float @alias(property: "total_steps")
  totalDistanceKm: Float @alias(property: "total_distance_km")
  activeEnergyKcal: Float @alias(property: "active_energy_kcal")
  basalEnergyKcal: Float @alias(property: "basal_energy_kcal")
  flightsClimbed: Float @alias(property: "flights_climbed")

  # Vitals
  avgBloodOxygen: Float @alias(property: "avg_blood_oxygen")
  avgRespiratoryRate: Float @alias(property: "avg_respiratory_rate")
  bodyMassKg: Float @alias(property: "body_mass_kg")
  vo2max: Float

  # Sleep + workouts
  sleepHours: Float @alias(property: "sleep_hours")
  workoutCount: Int @alias(property: "workout_count")
  workoutMinutes: Float @alias(property: "workout_minutes")

  # Free-text description used by similarity search / embedding pipelines.
  description: String

  day: Day @relationship(type: "HAS_SUMMARY", direction: IN)
}

type Workout @node {
  uid: ID!
  activityType: String @alias(property: "activity_type")
  rawType: String @alias(property: "raw_type")
  durationMin: Float @alias(property: "duration_min")
  startDate: DateTime @alias(property: "start_date")
  endDate: DateTime @alias(property: "end_date")
  device: String
  sourceName: String @alias(property: "source_name")

  day: Day @relationship(type: "ON_DAY", direction: OUT)
  recordedBy: Person @relationship(type: "RECORDED", direction: IN)
  followedBy: [SleepSession!]! @relationship(type: "FOLLOWED_BY", direction: OUT)
}

type SleepSession @node {
  date: Date!
  asleepMinutes: Float @alias(property: "asleep_minutes")
  inBedMinutes: Float @alias(property: "in_bed_minutes")
  sourceName: String @alias(property: "source_name")

  day: Day @relationship(type: "ON_DAY", direction: OUT)
  precededBy: [Workout!]! @relationship(type: "FOLLOWED_BY", direction: IN)
}

type MetricType @node {
  identifier: ID!
  displayName: String @alias(property: "display_name")
  unit: String
  category: String
}

# ---------------------------------------------------------------------------
# Custom mutations — upsert (MERGE) semantics
# ---------------------------------------------------------------------------
#
# Auto-generated mutations (createDays, updateDays, ...) only CREATE or
# UPDATE existing — they don't MERGE. The iOS app sends one of these per day
# / workout / sleep session it wants to persist, idempotently.
#
# Authorization is gated by the JWKS provider configured on the Data API.
# Any caller with a valid JWT can write — when we extend to multi-user, add
# @authorization(validate: [...]) directives that check $jwt.sub.

input DailySummaryUpsertInput {
  date: Date!
  dayOfWeek: String
  weekIso: String

  avgHeartRate: Float
  minHeartRate: Float
  maxHeartRate: Float
  restingHeartRate: Float
  hrvMean: Float
  totalSteps: Float
  totalDistanceKm: Float
  activeEnergyKcal: Float
  basalEnergyKcal: Float
  flightsClimbed: Float
  exerciseMinutes: Float
  standHours: Float
  avgBloodOxygen: Float
  avgRespiratoryRate: Float
  bodyMassKg: Float
  vo2max: Float
  sleepHours: Float
  workoutCount: Int
  workoutMinutes: Float
  description: String
}

input WorkoutUpsertInput {
  uid: ID!
  activityType: String!
  startDate: DateTime!
  endDate: DateTime!
  durationMin: Float
  device: String
  sourceName: String
}

input SleepUpsertInput {
  date: Date!
  asleepMinutes: Float!
  inBedMinutes: Float
  sourceName: String
}

type Mutation {
  """Upsert one Day + its DailySummary in a single MERGE. Returns the updated date."""
  ingestDay(input: DailySummaryUpsertInput!): String!
    @cypher(statement: """
      MERGE (d:Day {date: date($input.date)})
        ON CREATE SET d.day_of_week = $input.dayOfWeek
      MERGE (s:DailySummary {date: date($input.date)})
      SET s.avg_heart_rate     = $input.avgHeartRate,
          s.min_heart_rate     = $input.minHeartRate,
          s.max_heart_rate     = $input.maxHeartRate,
          s.resting_heart_rate = $input.restingHeartRate,
          s.hrv_mean           = $input.hrvMean,
          s.total_steps        = $input.totalSteps,
          s.total_distance_km  = $input.totalDistanceKm,
          s.active_energy_kcal = $input.activeEnergyKcal,
          s.basal_energy_kcal  = $input.basalEnergyKcal,
          s.flights_climbed    = $input.flightsClimbed,
          s.avg_blood_oxygen   = $input.avgBloodOxygen,
          s.avg_respiratory_rate = $input.avgRespiratoryRate,
          s.body_mass_kg       = $input.bodyMassKg,
          s.vo2max             = $input.vo2max,
          s.sleep_hours        = $input.sleepHours,
          s.workout_count      = $input.workoutCount,
          s.workout_minutes    = $input.workoutMinutes,
          s.description        = $input.description
      MERGE (d)-[:HAS_SUMMARY]->(s)
      FOREACH (_ IN CASE WHEN $input.weekIso IS NULL THEN [] ELSE [1] END |
        MERGE (w:Week {iso: $input.weekIso})
        MERGE (d)-[:PART_OF]->(w)
      )
      RETURN toString(d.date) AS date
    """, columnName: "date")

  """Upsert a Workout. Returns the workout uid."""
  ingestWorkout(input: WorkoutUpsertInput!): String!
    @cypher(statement: """
      MERGE (w:Workout {uid: $input.uid})
      SET w.activity_type = $input.activityType,
          w.start_date    = datetime($input.startDate),
          w.end_date      = datetime($input.endDate),
          w.duration_min  = $input.durationMin,
          w.device        = $input.device,
          w.source_name   = $input.sourceName
      WITH w, date(datetime($input.startDate)) AS dayDate
      MERGE (d:Day {date: dayDate})
      MERGE (w)-[:ON_DAY]->(d)
      RETURN w.uid AS uid
    """, columnName: "uid")

  """Upsert a SleepSession keyed by date."""
  ingestSleep(input: SleepUpsertInput!): String!
    @cypher(statement: """
      MERGE (s:SleepSession {date: date($input.date)})
      SET s.asleep_minutes = $input.asleepMinutes,
          s.in_bed_minutes = $input.inBedMinutes,
          s.source_name    = $input.sourceName
      MERGE (d:Day {date: date($input.date)})
      MERGE (s)-[:ON_DAY]->(d)
      RETURN toString(s.date) AS date
    """, columnName: "date")
}
